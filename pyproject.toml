[project]
name = "adams-tutoria"
version = "0.1.0"
description = "Local application to support tutoring and monitoring of ADAMS online courses"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Javier", email = "javier@example.com"}
]
dependencies = ["openpyxl>=3.1.5", "playwright>=1.50,<2", "python-dotenv>=1.0,<2", "pyyaml>=6.0,<7", "streamlit>=1.43,<2"]
license = {text = "MIT"}

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project.scripts]
adams-tutoria = "adams_tutoria.__main__:main"
adams-login = "adams_tutoria.adams_login_cli:main"
adams-monitor = "adams_tutoria.continuous_monitoring:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["openpyxl"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit"]
ignore_missing_imports = true
