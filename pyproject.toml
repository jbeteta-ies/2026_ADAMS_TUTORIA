[project]
name = "adams-tutoria"
version = "0.1.0"
description = "Local application to support tutoring and monitoring of ADAMS online courses"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Javier", email = "javier@example.com"}
]
license = {text = "MIT"}

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project.scripts]
adams-tutoria = "adams_tutoria.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true